<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flujo Completo 3H — Recorrido Animado</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:"Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background:#eef1f4;
    color:#1c2430;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  /* ---------- HEADER ---------- */
  header {
    flex:0 0 auto;
    display:flex; align-items:center; gap:16px;
    padding:7px 20px;
    background:#ffffff;
    border-bottom:2px solid #E06010;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    z-index:5;
  }
  .logo {
    background:linear-gradient(135deg,#F0821A,#C24E00);
    color:#fff; font-weight:800; font-size:18px;
    padding:6px 13px; border-radius:8px; letter-spacing:.5px;
    box-shadow:0 2px 8px rgba(224,96,16,.35);
  }
  .titles h1 { font-size:16.5px; font-weight:700; letter-spacing:.2px; color:#1c2430; }
  .titles p  { font-size:12px; color:#6b7684; margin-top:1px; }
  .legend {
    margin-left:auto; display:flex; gap:18px; align-items:center;
    font-size:11.5px; color:#5a6472;
  }
  .legend span { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .chip-proc { width:16px; height:11px; border-radius:3px; background:linear-gradient(135deg,#E24444,#C62E2E); }
  .chip-dec  { width:13px; height:13px; background:#F0901E; clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
  .chip-line { width:22px; height:0; border-top:2.5px solid #2b2f36; }
  .chip-loop { width:22px; height:0; border-top:2.5px dashed #E8A33D; }

  /* ---------- STAGE ---------- */
  main {
    flex:1 1 auto; min-height:0;
    display:flex; align-items:center; justify-content:center;
    padding:14px 18px 6px;
  }
  #stage {
    position:relative;
    background:#ffffff;
    border-radius:16px;
    box-shadow:0 10px 40px rgba(20,30,45,.18), 0 0 0 1px rgba(20,30,45,.06);
    overflow:hidden;
    flex:0 0 auto;
  }
  #camera {
    position:absolute; top:0; left:0;
    width:1960px; height:1430px;
    transform-origin:0 0;
    transition:transform .95s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  #moduleBadge {
    position:absolute; top:14px; left:14px; z-index:20;
    padding:8px 18px; border-radius:20px;
    background:linear-gradient(135deg,#F0821A,#D45A08);
    color:#fff; font-weight:800; font-size:13px; letter-spacing:.5px;
    box-shadow:0 4px 14px rgba(0,0,0,.28);
    transition:opacity .35s;
    pointer-events:none;
  }

  /* ---------- LANES ---------- */
  .titlebar {
    position:absolute; top:0; left:0; width:1960px; height:60px;
    background:linear-gradient(135deg,#E8720F,#D45A08);
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:800; letter-spacing:.4px;
  }
  .lane-band {
    position:absolute; left:210px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  }
  .lane-label {
    position:absolute; left:0; width:210px;
    background:#E06010; color:#fff;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:18px; font-weight:800; line-height:1.35; letter-spacing:.3px;
    padding:0 10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  }

  /* ---------- NODES ---------- */
  .node {
    position:absolute;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:16px; line-height:1.3;
    padding:6px 10px; cursor:pointer;
    transition:transform .4s cubic-bezier(.4,0,.2,1), filter .4s;
  }
  .node .lines { pointer-events:none; }
  .node .lines div.b { font-size:14.5px; }
  .node.rect {
    border-radius:12px;
    background:linear-gradient(160deg,#EC5C56 0%,#D7362F 55%,#C22B26 100%);
    color:#fff; font-weight:700;
    box-shadow:0 5px 14px rgba(150,30,25,.28), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .node.oval {
    border-radius:999px;
    background:linear-gradient(160deg,#FCE07A 0%,#F0B90B 100%);
    color:#3a2a00; font-weight:800; font-size:18px; letter-spacing:.5px;
    box-shadow:0 5px 14px rgba(180,130,0,.28), inset 0 1px 0 rgba(255,255,255,.5);
  }
  .node.diamond {
    color:#3a1e00; font-weight:700;
    position:absolute; z-index:0;
  }
  .node.diamond::before {
    content:'';
    position:absolute; inset:0; z-index:-1;
    clip-path:polygon(50% 2%, 98% 50%, 50% 98%, 2% 50%);
    background:linear-gradient(160deg,#F8B25C 0%,#EC8412 60%,#DD7207 100%);
    filter:drop-shadow(0 5px 8px rgba(150,80,0,.32));
  }
  .node.note {
    border-radius:8px;
    background:#fffaf0;
    border:1.5px solid #c99a4e;
    border-left:5px solid #d99a2b;
    color:#5a4720; font-weight:600;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
  }
  .node.active {
    transform:scale(1.09);
    z-index:10;
  }
  .node.rect.active, .node.oval.active, .node.note.active {
    box-shadow:0 0 0 5px rgba(255,213,79,.95), 0 10px 30px 6px rgba(240,145,20,.5);
  }
  .node.diamond.active::before {
    filter:drop-shadow(0 5px 8px rgba(150,80,0,.32)) drop-shadow(0 0 7px rgba(255,213,79,.95)) drop-shadow(0 0 20px rgba(240,145,20,.75));
  }

  /* ---------- EDGES ---------- */
  #edgesSvg { position:absolute; top:0; left:0; pointer-events:none; }
  .edge-path { fill:none; stroke:#3a4048; stroke-width:3.4; stroke-linecap:round; stroke-linejoin:round; }
  .edge-path.dashed { stroke:#E8A33D; stroke-dasharray:9 7; }
  .edge-label {
    position:absolute; background:#fff; border:1px solid #d8dde3; border-radius:5px;
    padding:2px 8px; font-size:12px; font-weight:700; color:#333; white-space:nowrap;
    transform:translate(-50%,-50%);
  }
  .edge-label.yes { color:#1f8a3c; border-color:#8fd6a6; }
  .edge-label.no  { color:#c23a2e; border-color:#e8a9a2; }
  #pulseDot {
    filter:drop-shadow(0 0 8px rgba(240,145,20,.95));
  }

  /* ---------- CONTROLS / PANEL ---------- */
  #panelWrap { flex:0 0 auto; padding:7px 20px 10px; background:#fff; border-top:1px solid #e3e7eb; }
  #progressTrack { height:6px; background:#e7eaee; border-radius:4px; overflow:hidden; margin-bottom:10px; }
  #progressBar { height:100%; width:0%; background:linear-gradient(90deg,#F0901E,#E06010); transition:width .5s; }
  #panel { display:flex; align-items:center; gap:16px; }
  #stepBadge {
    flex:0 0 auto; background:#E06010; color:#fff; font-weight:800; font-size:13px;
    padding:6px 12px; border-radius:20px; white-space:nowrap;
  }
  #desc { flex:1 1 auto; font-size:14px; color:#2a323c; line-height:1.4; }
  .controls { flex:0 0 auto; display:flex; gap:8px; }
  .btn {
    border:none; background:#f0f2f5; color:#1c2430; font-weight:700; font-size:13px;
    padding:9px 15px; border-radius:9px; cursor:pointer; transition:background .2s, transform .1s;
    display:flex; align-items:center; gap:6px;
  }
  .btn:hover { background:#e3e7eb; }
  .btn:active { transform:scale(.96); }
  .btn.primary { background:linear-gradient(135deg,#F0821A,#D45A08); color:#fff; box-shadow:0 3px 10px rgba(224,96,16,.35); }
  .btn.primary:hover { background:linear-gradient(135deg,#e8791a,#c9530d); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  .btn:hover { transform:translateY(-1px); }
</style>
</head>
<body>

<header>
  <div class="logo">3H</div>
  <div class="titles">
    <h1>Sistema de Gestión Operativo 3H — Flujo de Datos Completo</h1>
    <p>Ingeniería → Operaciones → Dispatch → Laboratorio y Planta → Gerencia → Contabilidad</p>
  </div>
  <div class="legend">
    <span><i class="chip-proc"></i> Proceso</span>
    <span><i class="chip-dec"></i> Decisión</span>
    <span><i class="chip-line"></i> Flujo normal</span>
    <span><i class="chip-loop"></i> Reintento / excepción</span>
  </div>
</header>

<main>
  <div id="stage">
    <div id="camera">
      <div class="titlebar">SISTEMA DE GESTIÓN OPERATIVO 3H — FLUJO DE DATOS (incluye Ingeniería)</div>
      <!-- lane bands + labels injected by JS -->
      <div id="lanesLayer"></div>
      <svg id="edgesSvg" width="1960" height="1430">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#2b2f36"></path>
          </marker>
          <marker id="arrowDash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#E8A33D"></path>
          </marker>
        </defs>
        <g id="pathsLayer"></g>
        <circle id="pulseDot" r="9" fill="#FFC93C" stroke="#fff" stroke-width="2" style="display:none"></circle>
      </svg>
      <div id="nodesLayer"></div>
      <div id="labelsLayer"></div>
    </div>
    <div id="moduleBadge"></div>
  </div>
</main>

<div id="panelWrap">
  <div id="progressTrack"><div id="progressBar"></div></div>
  <div id="panel">
    <div id="stepBadge">Paso 1 / 1</div>
    <div id="desc">Cargando…</div>
    <div class="controls">
      <button class="btn" id="btnOverview">🔍 Vista completa</button>
      <button class="btn" id="btnPrev">◀ Anterior</button>
      <button class="btn primary" id="btnAuto">▶ Reproducir</button>
      <button class="btn" id="btnNext">Siguiente ▶</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATOS DEL DIAGRAMA
   ============================================================ */
const LANES = [
  { id:'ing',  label:'MÓDULO\nINGENIERÍA',        y:60,  h:200, color:'#4E9E52' },
  { id:'ope',  label:'MÓDULO\nOPERACIONES',        y:260, h:180, color:'#C58A52' },
  { id:'dis',  label:'MÓDULO\nDISPATCH',           y:440, h:350, color:'#4E9E52' },
  { id:'lab',  label:'LABORATORIO\nY PLANTA',       y:790, h:260, color:'#C58A52' },
  { id:'ger',  label:'MÓDULO\nGERENCIA',            y:1050,h:240, color:'#C58A52' },
  { id:'con',  label:'CONTABILIDAD',                y:1290,h:140, color:'#C58A52' },
];

const NODES = {
  inicio:        { type:'oval',    x:250,  y:132, w:100, h:60,  t:'INICIO' },
  crear_frente:  { type:'rect',    x:400,  y:122, w:210, h:80,  t:'Crear/Definir Frente de Trabajo:\ntúnel/manto/calle/tipo' },
  seguimiento:   { type:'rect',    x:660,  y:122, w:220, h:80,  t:'Seguimiento de Estado\n(ventilación, estabilidad, fecha estimada operativae e)' },
  frente_listo:  { type:'diamond', x:930,  y:100, w:180, h:124, t:'¿Frente listo\npara operar?' },

  perforacion:   { type:'rect',    x:940,  y:310, w:210, h:80,  t:'Registro de Perforación\ny Tronadura' },
  extraccion:    { type:'rect',    x:1200, y:310, w:220, h:80,  t:'Extracción mineral\nmina a cancha (camión dumper)' },

  dumpadas:      { type:'rect',    x:250,  y:470, w:190, h:80,  t:'Registro de Dumpadas' },
  muestra:       { type:'rect',    x:480,  y:470, w:200, h:80,  t:'Proceso de Toma\nde Muestra' },
  envio_lab:     { type:'rect',    x:720,  y:470, w:200, h:80,  t:'Envío de muestra\na laboratorio' },
  nota_cancha:   { type:'note',    x:960,  y:478, w:230, h:66,  t:'Se mantiene en cancha\nhasta cumplir la ley' },

  gen_lotes:     { type:'rect',    x:760,  y:600, w:200, h:80,  t:'Generar Lotes Internos' },
  cargar:        { type:'rect',    x:500,  y:600, w:220, h:80,  t:'Cargar camiones de\ndistintos lotes internos' },
  despacho:      { type:'rect',    x:250,  y:600, w:210, h:80,  t:'Despacho de\ncamiones a planta' },

  ingresan:      { type:'rect',    x:250,  y:700, w:200, h:84,  t:'Ingresan camiones a planta\n(ticket: N° lote planta, peso, fecha, hora)' },
  procesamiento: { type:'rect',    x:250,  y:878, w:200, h:64,  t:'Procesamiento mineral\nen planta' },
  muestra_rep:   { type:'rect',    x:250,  y:954, w:200, h:64,  t:'Muestra representativa\n(paquete de segunda)' },

  analisis:      { type:'rect',    x:560,  y:850, w:220, h:90,  t:'Análisis de muestras\nEntrega de resultados de ley de las muestras' },
  lote_interno:  { type:'rect',    x:890,  y:838, w:250, h:112, t:'Generar LOTE INTERNO\n• Objetivo = 1,3% Cu Insoluble\n• Mezcla de dumpadas = 100 Ton.\n• Aplicar error de muestra = 19%' },
  mezcla_cumple: { type:'diamond', x:1210, y:832, w:190, h:130, t:'¿Mezcla de\ndumpadas cumple?' },

  dentro_10:     { type:'diamond', x:560,  y:1048,w:220, h:150, t:'¿Se encuentra dentro de la\ndesviación estándar de ±10%\nsobre la ley?' },
  auditoria:     { type:'rect',    x:575,  y:1226,w:190, h:56,  t:'Auditoría Interna' },
  intercambio:   { type:'note',    x:840,  y:1078,w:260, h:121, t:'Se realiza el intercambio de leyes de la\nplanta procesadora (paquete primera) v/s\nel productor de mineral (paquete segunda)' },
  canje:         { type:'rect',    x:1160, y:1078,w:200, h:80,  t:'Canje paquete de segunda\npor paquete de planta' },
  dentro_010:    { type:'diamond', x:1410, y:1042,w:210, h:150, t:'¿Caemos dentro del 0,10%\naceptable para que el lote\nsea canjeado?' },
  lab_externo:   { type:'note',    x:1670, y:1072,w:260, h:122, t:'Se manda a laboratorio externo un\npaquete de tercero que determina la ley\ncon la que se liquidará el LOTE PLANTA' },

  liquidacion:   { type:'rect',    x:1150, y:1315,w:240, h:100, t:'• Se realiza el canje\n• La planta emite una liquidación de pago\n• La dueña del mineral emite la factura correspondiente' },
  deposito:      { type:'rect',    x:1430, y:1315,w:240, h:102, t:'• La planta procesadora realiza\n  el depósito del dinero\n• La contabilidad registra el pago' },
  fin:           { type:'oval',    x:1700, y:1335,w:100, h:60,  t:'FIN' },
};

const STEPS = [
  { to:'inicio', desc:'Inicio del proceso operativo completo, desde la planificación en Ingeniería hasta el pago en Contabilidad.' },
  { from:'inicio', to:'crear_frente', desc:'Ingeniería crea y define el frente de trabajo: túnel, manto, calle, hebra y tipo.' },
  { from:'crear_frente', to:'seguimiento', desc:'Se hace seguimiento del estado del frente: ventilación, estabilidad estructural y fecha estimada de inicio.' },
  { from:'seguimiento', to:'frente_listo', desc:'Se evalúa si el frente cumple las condiciones para comenzar a operar.' },
  { from:'frente_listo', to:'perforacion', label:'Sí', cls:'yes', desc:'Con el frente listo, Operaciones registra la perforación y tronadura.' },
  { from:'perforacion', to:'extraccion', desc:'Se extrae el mineral desde la mina hacia la cancha de acopio, transportado en camión dumper.' },
  { from:'extraccion', to:'dumpadas', desc:'Dispatch registra cada dumpada: el volcado de mineral en la cancha.' },
  { from:'dumpadas', to:'muestra', desc:'Se toma una muestra representativa de la dumpada; el material se mantiene en cancha hasta cumplir la ley objetivo.' },
  { from:'muestra', to:'envio_lab', desc:'La muestra se envía al laboratorio para su análisis.' },
  { from:'envio_lab', to:'analisis', startSide:'bottom', endSide:'top',
    viaPoints:[{x:820,y:580},{x:1000,y:580},{x:1000,y:700},{x:670,y:700}],
    desc:'Laboratorio recibe la muestra y realiza el análisis, entregando los resultados con la ley de la muestra.' },
  { from:'analisis', to:'lote_interno', label:'Ley dumpada', desc:'Con la ley de la dumpada confirmada, se genera el Lote Interno: objetivo 1,3% Cu insoluble, mezcla de 100 toneladas, con un margen de error de muestra del 19%.' },
  { from:'lote_interno', to:'mezcla_cumple', desc:'Se evalúa si la mezcla de dumpadas del lote interno cumple con la ley objetivo.' },
  { from:'mezcla_cumple', to:'muestra', label:'No', cls:'no', dashed:true, startSide:'top', endSide:'top', viaY:455, desc:'Si la mezcla no cumple, se reintenta el Proceso de Toma de Muestra — el material se mantiene en cancha mientras tanto — hasta alcanzar la ley objetivo.' },
  { from:'mezcla_cumple', to:'gen_lotes', label:'Sí', cls:'yes', startSide:'top', endSide:'bottom', viaY:720, desc:'Cuando la mezcla cumple, Dispatch genera los Lotes Internos definitivos.' },
  { from:'gen_lotes', to:'cargar', desc:'Se cargan camiones con material de distintos lotes internos.' },
  { from:'cargar', to:'despacho', desc:'Los camiones son despachados hacia la planta.' },
  { from:'despacho', to:'ingresan', desc:'Los camiones ingresan a la planta procesadora de minerales. Dispatch registra en el sistema 3H los datos entregados por la planta a través del ticket: N° de lote planta, peso, fecha y hora.' },
  { from:'ingresan', to:'procesamiento', desc:'La planta procesa el mineral recibido.' },
  { from:'procesamiento', to:'muestra_rep', desc:'Se obtiene una muestra representativa del proceso: el paquete de segunda.' },
  { from:'muestra_rep', to:'dentro_10', label:'Comparar ley', desc:'Gerencia compara la ley del Lote Interno contra el paquete de segunda de planta, evaluando si están dentro del ±10% de desviación aceptable.' },
  { from:'dentro_10', to:'auditoria', label:'No', cls:'no', dashed:true, desc:'Si la diferencia excede el margen aceptable, se activa una Auditoría Interna para revisar el proceso.' },
  { from:'auditoria', to:'dentro_10', dashed:true, desc:'Tras la auditoría, se vuelve a evaluar la comparación de leyes.' },
  { from:'dentro_10', to:'intercambio', label:'Sí', cls:'yes', desc:'Dentro del margen aceptable, se realiza el intercambio de leyes entre la planta procesadora (paquete primera) y el productor del mineral (paquete segunda).' },
  { from:'intercambio', to:'canje', desc:'Se concreta el canje del paquete de segunda por el paquete de planta.' },
  { from:'canje', to:'dentro_010', desc:'Se evalúa si el Lote Planta queda dentro del 0,10% aceptable para validar el canje.' },
  { from:'dentro_010', to:'lab_externo', label:'No', cls:'no', dashed:true, desc:'Si no se cumple el margen, se envía un paquete de tercero a un laboratorio externo, que determinará la ley definitiva con la que se liquidará el Lote Planta.' },
  { from:'lab_externo', to:'dentro_010', dashed:true, desc:'Con el resultado externo, se retoma la validación del Lote Planta.' },
  { from:'dentro_010', to:'liquidacion', label:'Sí', cls:'yes', desc:'Validado el lote, se realiza el canje: la planta emite la liquidación de pago y la dueña del mineral emite la factura correspondiente.' },
  { from:'liquidacion', to:'deposito', desc:'La planta procesadora realiza el depósito del dinero y Contabilidad registra el pago.' },
  { from:'deposito', to:'fin', desc:'Fin del proceso: el ciclo completo, desde la definición del frente hasta el pago, queda cerrado.' },
];

/* ============================================================
   RENDER ESTÁTICO: carriles + nodos
   ============================================================ */
const lanesLayer  = document.getElementById('lanesLayer');
const nodesLayer   = document.getElementById('nodesLayer');
const labelsLayer  = document.getElementById('labelsLayer');
const pathsLayer   = document.getElementById('pathsLayer');
const pulseDot     = document.getElementById('pulseDot');
const camera       = document.getElementById('camera');
const stage        = document.getElementById('stage');
const main         = document.querySelector('main');
const moduleBadge  = document.getElementById('moduleBadge');

function laneOf(nodeId){
  const n = NODES[nodeId];
  const cy = n.y + n.h/2;
  return LANES.find(l => cy >= l.y && cy <= l.y + l.h) || LANES[0];
}
function updateModuleBadge(idx){
  if (idx < 0) { moduleBadge.style.opacity = '0'; return; }
  moduleBadge.style.opacity = '1';
  moduleBadge.textContent = laneOf(STEPS[idx].to).label.replace('\n',' ');
}

LANES.forEach(l => {
  const band = document.createElement('div');
  band.className = 'lane-band';
  band.style.top = l.y + 'px';
  band.style.height = l.h + 'px';
  band.style.width = (1960-210) + 'px';
  band.style.background = l.color;
  lanesLayer.appendChild(band);

  const lbl = document.createElement('div');
  lbl.className = 'lane-label';
  lbl.style.top = l.y + 'px';
  lbl.style.height = l.h + 'px';
  lbl.innerHTML = l.label.split('\n').map(x=>`<div>${x}</div>`).join('');
  lanesLayer.appendChild(lbl);
});

const nodeEls = {};
Object.keys(NODES).forEach(id => {
  const n = NODES[id];
  const el = document.createElement('div');
  el.className = 'node ' + n.type;
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';
  el.style.width  = n.w + 'px';
  el.style.height = n.h + 'px';
  const lines = n.t.split('\n');
  el.innerHTML = `<div class="lines">${lines.map((l,i)=>`<div class="${i===0 && lines.length>1 ? 'a':'b'}">${l}</div>`).join('')}</div>`;
  el.addEventListener('click', () => {
    const idx = STEPS.findIndex(s => s.to === id);
    if (idx >= 0) goTo(idx);
  });
  nodesLayer.appendChild(el);
  nodeEls[id] = el;
});

/* ============================================================
   GEOMETRÍA DE CONEXIONES
   ============================================================ */
function center(n){ return { x:n.x+n.w/2, y:n.y+n.h/2 }; }
function anchor(n, side){
  const c = center(n);
  if (side==='top')    return { x:c.x, y:n.y };
  if (side==='bottom') return { x:c.x, y:n.y+n.h };
  if (side==='left')   return { x:n.x, y:c.y };
  if (side==='right')  return { x:n.x+n.w, y:c.y };
  return c;
}
function laneIndexOfNode(n){
  const cy = n.y + n.h/2;
  return LANES.findIndex(l => cy >= l.y && cy <= l.y + l.h);
}
function edgeGeometry(a, b, override){
  const ca = center(a), cb = center(b);
  const dx = cb.x-ca.x, dy = cb.y-ca.y;
  const crossLane = laneIndexOfNode(a) !== laneIndexOfNode(b);
  const preferVertical = crossLane || Math.abs(dy) > Math.abs(dx);
  let startSide = override?.startSide, endSide = override?.endSide;
  if (!startSide || !endSide) {
    if (preferVertical) { startSide = startSide || (dy>=0?'bottom':'top'); endSide = endSide || (dy>=0?'top':'bottom'); }
    else                 { startSide = startSide || (dx>=0?'right':'left'); endSide = endSide || (dx>=0?'left':'right'); }
  }
  const start = anchor(a, startSide), end = anchor(b, endSide);
  const startHoriz = startSide==='left' || startSide==='right';
  const endHoriz   = endSide==='left'   || endSide==='right';
  let pts;
  if (override?.viaPoints) {
    pts = [start, ...override.viaPoints, end];
  } else if (start.x===end.x || start.y===end.y) {
    pts = [start, end];
  } else if (startHoriz && endHoriz) {
    const midX = (start.x+end.x)/2;
    pts = [start, {x:midX,y:start.y}, {x:midX,y:end.y}, end];
  } else if (!startHoriz && !endHoriz) {
    const midY = override?.viaY!=null ? override.viaY : (start.y+end.y)/2;
    pts = [start, {x:start.x,y:midY}, {x:end.x,y:midY}, end];
  } else if (startHoriz && !endHoriz) {
    pts = [start, {x:end.x,y:start.y}, end];
  } else {
    pts = [start, {x:start.x,y:end.y}, end];
  }
  const d = 'M' + pts.map(p => `${p.x},${p.y}`).join(' L ');
  const mid = pts.length%2===0
    ? { x:(pts[pts.length/2-1].x+pts[pts.length/2].x)/2, y:(pts[pts.length/2-1].y+pts[pts.length/2].y)/2 }
    : pts[Math.floor((pts.length-1)/2)];
  return { d, mid };
}

/* ============================================================
   MOTOR DE PASOS
   ============================================================ */
const svgNS = 'http://www.w3.org/2000/svg';
let current = -1;
let autoTimer = null;
let overview = false;

function clearFrom(idx){
  [...pathsLayer.children].forEach(c => { if (+c.dataset.step > idx) c.remove(); });
  [...labelsLayer.children].forEach(c => { if (+c.dataset.step > idx) c.remove(); });
}

function drawEdge(stepIdx, animate){
  const s = STEPS[stepIdx];
  if (!s.from) return;
  const a = NODES[s.from], b = NODES[s.to];
  const { d, mid } = edgeGeometry(a, b, { startSide:s.startSide, endSide:s.endSide, viaY:s.viaY, viaPoints:s.viaPoints });
  const path = document.createElementNS(svgNS, 'path');
  path.setAttribute('d', d);
  path.setAttribute('class', 'edge-path' + (s.dashed ? ' dashed':''));
  path.setAttribute('marker-end', s.dashed ? 'url(#arrowDash)' : 'url(#arrow)');
  path.dataset.step = stepIdx;
  pathsLayer.appendChild(path);

  if (s.label) {
    const lb = document.createElement('div');
    lb.className = 'edge-label' + (s.cls ? ' '+s.cls : '');
    lb.style.left = mid.x + 'px';
    lb.style.top  = mid.y + 'px';
    lb.textContent = s.label;
    lb.dataset.step = stepIdx;
    labelsLayer.appendChild(lb);
  }

  if (animate) {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    pulseDot.style.display = 'block';
    const dur = 750;
    const t0 = performance.now();
    function frame(t){
      const p = Math.min(1, (t-t0)/dur);
      const ease = 1 - Math.pow(1-p, 3);
      path.style.strokeDashoffset = len * (1-ease);
      const pt = path.getPointAtLength(len*ease);
      pulseDot.setAttribute('cx', pt.x);
      pulseDot.setAttribute('cy', pt.y);
      if (p < 1) requestAnimationFrame(frame);
      else setTimeout(()=>{ pulseDot.style.display='none'; }, 180);
    }
    requestAnimationFrame(frame);
  }
}

const DIAGRAM_W = 1960, DIAGRAM_H = 1430;

function sizeStage(){
  const availW = main.clientWidth  - 24;
  const availH = main.clientHeight - 16;
  const maxAspect = 1.6; // tope ancho:alto, cercano a la proporción del diagrama (evita franjas blancas grandes)
  const w = Math.min(availW, availH * maxAspect);
  stage.style.width  = w + 'px';
  stage.style.height = availH + 'px';
}

function focusCamera(nodeId){
  const n = NODES[nodeId];
  const c = center(n);
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let scale = (sw*0.30)/n.w;
  scale = Math.max(1.2, Math.min(2.3, scale));
  const tx = sw/2 - scale*c.x;
  const ty = sh/2 - scale*c.y;
  camera.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function fitCamera(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const scale = Math.min(sw/DIAGRAM_W, sh/DIAGRAM_H) * 0.97;
  const tx = (sw - DIAGRAM_W*scale)/2;
  const ty = (sh - DIAGRAM_H*scale)/2;
  camera.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}

function layout(){
  sizeStage();
  if (overview || current < 0) fitCamera();
  else focusCamera(STEPS[current].to);
}

function updateNodeStates(idx){
  Object.keys(nodeEls).forEach(id => nodeEls[id].classList.remove('active'));
  if (idx >= 0) nodeEls[STEPS[idx].to].classList.add('active');
}

function updatePanel(idx){
  if (idx < 0) {
    document.getElementById('stepBadge').textContent = 'Vista general';
    document.getElementById('desc').textContent = 'Recorrido completo del proceso operativo 3H. Pulsa "Comenzar" para avanzar paso a paso.';
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('btnPrev').disabled = true;
    document.getElementById('btnNext').disabled = false;
    document.getElementById('btnNext').textContent = 'Comenzar ▶';
    return;
  }
  document.getElementById('stepBadge').textContent = `Paso ${idx+1} / ${STEPS.length}`;
  document.getElementById('desc').textContent = STEPS[idx].desc;
  document.getElementById('progressBar').style.width = (100*(idx+1)/STEPS.length) + '%';
  document.getElementById('btnPrev').disabled = idx<=0;
  document.getElementById('btnNext').disabled = idx>=STEPS.length-1;
  document.getElementById('btnNext').textContent = 'Siguiente ▶';
}

function goTo(idx, animateLast){
  if (idx>=STEPS.length) return;
  if (idx < 0) { showOverview(); return; }
  overview = false;
  document.getElementById('btnOverview').textContent = '🔍 Vista completa';
  const animate = animateLast!==undefined ? animateLast : (idx===current+1);
  pathsLayer.innerHTML = '';
  labelsLayer.innerHTML = '';
  for (let i=1; i<=idx; i++){
    drawEdge(i, animate && i===idx);
  }
  updateNodeStates(idx);
  updateModuleBadge(idx);
  focusCamera(STEPS[idx].to);
  updatePanel(idx);
  current = idx;
}

function showOverview(){
  overview = true;
  current = -1;
  document.getElementById('btnOverview').textContent = '🔎 Volver al foco';
  pathsLayer.innerHTML = '';
  labelsLayer.innerHTML = '';
  for (let i=1; i<STEPS.length; i++) drawEdge(i, false);
  updateNodeStates(-1);
  updateModuleBadge(-1);
  fitCamera();
  updatePanel(-1);
}

function next(){ if (current < STEPS.length-1) goTo(current+1, true); else stopAuto(); }
function prev(){ if (current > 0) goTo(current-1, false); else if (current===0) showOverview(); }

function toggleOverview(){
  if (overview) { if (current>=0) goTo(current); else goTo(0); return; }
  overview = true;
  document.getElementById('btnOverview').textContent = '🔎 Volver al foco';
  pathsLayer.innerHTML = '';
  labelsLayer.innerHTML = '';
  for (let i=1; i<STEPS.length; i++) drawEdge(i, false);
  fitCamera();
}

function startAuto(){
  document.getElementById('btnAuto').textContent = '⏸ Pausar';
  autoTimer = setInterval(() => {
    if (current >= STEPS.length-1) { stopAuto(); return; }
    next();
  }, 3600);
}
function stopAuto(){
  document.getElementById('btnAuto').textContent = '▶ Reproducir';
  clearInterval(autoTimer); autoTimer = null;
}

document.getElementById('btnNext').addEventListener('click', () => { stopAuto(); next(); });
document.getElementById('btnPrev').addEventListener('click', () => { stopAuto(); prev(); });
document.getElementById('btnOverview').addEventListener('click', () => { stopAuto(); toggleOverview(); });
document.getElementById('btnAuto').addEventListener('click', () => { autoTimer ? stopAuto() : startAuto(); });
window.addEventListener('keydown', e => {
  if (e.code==='ArrowRight' || e.code==='Space'){ e.preventDefault(); stopAuto(); next(); }
  if (e.code==='ArrowLeft'){ stopAuto(); prev(); }
  if (e.key==='f' || e.key==='F'){ stopAuto(); toggleOverview(); }
});
window.addEventListener('resize', layout);

sizeStage();
showOverview();
</script>
</body>
